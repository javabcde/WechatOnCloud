name: sync-upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and auto-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add upstream remote
          git remote add upstream https://github.com/Gloridust/WechatOnCloud.git || true
          git fetch upstream --tags

          # Create temp branch for merge
          git checkout -B temp-sync main

          # Merge upstream code, excluding .github/workflows to protect custom workflows
          git merge --allow-unrelated-histories -X theirs upstream/main --no-commit --no-ff

          # Restore local workflow files (prevent upstream from overwriting custom workflows)
          if [ -d ".github/workflows" ]; then
            git checkout HEAD -- .github/workflows/
            echo "✅ Protected local workflow files from upstream overwrite."
          fi

          # Commit merge
          if git commit -m "Auto sync from upstream: $(git log --format=%h -n 1 upstream/main)"; then
            git push origin temp-sync:main
            echo "✅ Code synced from upstream."
          else
            echo "✅ No new code changes, skipping."
          fi

          git checkout main
          git branch -D temp-sync || true

          # Find latest upstream version tag
          NEW_VER=$(git tag -l "v*.*.*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)

          if [ -z "$NEW_VER" ]; then
            echo "❌ No valid version tag found."
            exit 1
          fi

          echo "🔍 Latest upstream version: $NEW_VER"

          # Check if a release already exists for this tag
          if gh release view "$NEW_VER" &>/dev/null; then
            echo "✅ Release $NEW_VER already exists, skipping."
            exit 0
          fi

          # Push tag and create GitHub Release (triggers release.yml → auto-build)
          git tag -f "$NEW_VER"
          git push origin "$NEW_VER" --force
          gh release create "$NEW_VER" --title "$NEW_VER" --generate-notes --latest
          echo "🚀 Release $NEW_VER created — release.yml will auto-build Docker images."
