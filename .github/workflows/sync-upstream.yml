name: sync-upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and trigger build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Gloridust/WechatOnCloud.git || true
          git fetch upstream --tags

          CHANGED=false

          git checkout -B temp-sync main
          if git merge --allow-unrelated-histories -X theirs upstream/main --no-commit --no-ff; then
            if [ -d ".github/workflows" ]; then
              git checkout HEAD -- .github/workflows/
              git clean -fd .github/workflows/
              git diff --cached --name-only .github/workflows/ | xargs -r git rm --cached --
            fi
            if git commit -m "Auto sync from upstream"; then
              git push origin temp-sync:main
              CHANGED=true
              echo "✅ Code synced."
            else
              echo "✅ No code changes."
            fi
          fi
          git checkout main
          git branch -D temp-sync || true

          # Auto-schedule: only build when upstream actually changed
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$CHANGED" = "false" ]; then
            echo "✅ No upstream changes, skipping build."
            exit 0
          fi

          LATEST_VER=$(git tag -l "v*.*.*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          echo "🔍 Latest upstream version: $LATEST_VER"

          # Dispatch release workflow on THIS fork (not upstream)
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "🚀 Build triggered. Check Actions tab for progress."
